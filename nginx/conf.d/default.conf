server {
    listen 80;
    server_name localhost;

    location / {
        return 200 'Discord LLM Bot is running. API endpoints available at /api/';
    }

    # MCP Server API routes
    location /api/ {
        proxy_pass http://mcp-server:5601/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Qdrant API routes
    location /qdrant/ {
        proxy_pass http://qdrant:6333/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LLama server routes (optional)
    location /llama/ {
        # Return 503 Service Unavailable if llama-server isn't available
        return 503 "Llama server is not currently available";
    }

    # SearxNG routes
    location /searx/ {
        proxy_pass http://searxng:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

